server:
  port: 8090
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: course-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/courses/**
        - id: assessment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/assessments/**,/api/results/**
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
